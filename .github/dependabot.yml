# Managed config: Dependabot version + security updates.
# Non-major updates are grouped into one PR and auto-merged once required checks pass
# (see .github/workflows/dependabot-auto-merge.yml). Major updates open as separate PRs
# and are NOT auto-merged; they wait for manual review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github_actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
